# LLM
embed_base: "http://localhost:8080/v1/"
llm_base: "http://localhost:8080/v1/"
embed_model: "text-embedding-ada-002"
llm_model: "local-model"
api_key: "sk-no-key-required"
llm_kwargs: {}
# Upload
upload_dir: "./data/uploads"

#  DB
persist_directory: "./my_db"
setup_rag_collection: "rag_collection"
db_url: "sqlite:///my_db/record_manager_cache.sql"

# test data
pdf_path: "/path/to/your/document.pdf"
test_search: "your keyword"
test_query: "What are the main contents of this document?"

# rerank
reranker_type: "cross_encoder"   # Local cross-encoder (default)
# reranker_type: "llm"           # Use existing LLM for scoring
# reranker_type: "none"          # Disable reranking
reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

# query
query_expansion_enabled: true
query_expansion_n: 3

# Knowledge / Notion (Step 0.3)
raw_db_path: "./my_db/raw.db"
# notion_token: "secret_..."   # set this to enable Notion sync
notion_token: "token"
notion_workspace_id: "workspace_id"
notion_database_id: "database_id"

# memory
memory_db_path: "./my_db/memory.db"
memory_default_session: "default"
memory_max_recent: 20
memory_max_topics: 10
memory_extract_topics: true
memory_auto_infer_project: true